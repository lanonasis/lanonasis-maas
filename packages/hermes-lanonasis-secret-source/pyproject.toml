[project]
name = "hermes-lanonasis-secret-source"
version = "0.1.0"
description = "LanOnasis secret source plugin for Hermes Agent (wireframe)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/lanonasis/lanonasis-maas/tree/main/packages/hermes-lanonasis-secret-source#readme"
Repository = "https://github.com/lanonasis/lanonasis-maas"
Source = "https://github.com/lanonasis/lanonasis-maas/tree/main/packages/hermes-lanonasis-secret-source"
Issues = "https://github.com/lanonasis/lanonasis-maas/issues"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.entry-points."hermes_agent.plugins"]
lanonasis-secrets = "hermes_lanonasis_secret_source"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hermes_lanonasis_secret_source"]

[tool.pytest.ini_options]
testpaths = ["tests"]
