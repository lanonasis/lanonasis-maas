[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-lanonasis-memory"
version = "0.2.0"
description = "LanOnasis MaaS memory provider for Hermes Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/lanonasis/lanonasis-maas/tree/main/packages/hermes-lanonasis-memory#readme"
Repository = "https://github.com/lanonasis/lanonasis-maas"
Source = "https://github.com/lanonasis/lanonasis-maas/tree/main/packages/hermes-lanonasis-memory"
Issues = "https://github.com/lanonasis/lanonasis-maas/issues"

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
]

# Register the package with Hermes' pip-installed plugin discovery.
# This is one of two supported install paths (the other is dropping the
# package directory directly under $HERMES_HOME/plugins/memory/<name>/).
[project.entry-points."hermes_agent.plugins"]
lanonasis = "hermes_lanonasis_memory"

[tool.setuptools.packages.find]
include = ["hermes_lanonasis_memory*"]
