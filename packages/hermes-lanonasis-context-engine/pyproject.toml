[project]
name = "hermes-lanonasis-context-engine"
version = "0.1.0"
description = "LanOnasis context engine plugin for Hermes Agent (skeleton/wireframe)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.entry-points."hermes_agent.plugins"]
lanonasis-context = "hermes_lanonasis_context_engine"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hermes_lanonasis_context_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
