[project]
name = "hermes-lanonasis-context-engine"
version = "0.1.0"
description = "LanOnasis context engine plugin for Hermes Agent (skeleton/wireframe)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.urls]
Repository = "https://github.com/lanonasis/lanonasis-maas"

[project.entry-points."hermes_agent.plugins"]
lanonasis-context = "hermes_lanonasis_context_engine"

# Context-engine discovery (`plugins.context_engine.discover_context_engines`)
# reads this group, not hermes_agent.plugins. Register under both so the
# package is visible to the legacy activation pathway AND the
# context-engine-specific scanner.
[project.entry-points."hermes_agent.context_engines"]
lanonasis-context = "hermes_lanonasis_context_engine"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hermes_lanonasis_context_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
