name: Publish CLI Package (Trusted Publishing)

on:
  push:
    branches: [ main ]
    paths:
      - 'cli/**'
      - 'cli/package.json'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 2.0.2)'
        required: true
        type: string

permissions:
  id-token: write  # Required for OIDC
  contents: write  # gh release create
  packages: write  # GitHub Packages publish

jobs:
  publish-cli:
    name: Publish @lanonasis/cli to NPM (Trusted Publishing)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Update version (if manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          cd cli
          npm version ${{ github.event.inputs.version }} --no-git-tag-version

      - name: Install dependencies
        run: |
          cd cli
          bun install --frozen-lockfile

      - name: Build CLI
        run: |
          cd cli
          bun run build

      - name: Test CLI
        run: |
          cd cli
          bun link
          lanonasis --version
          lanonasis --help

      - name: Setup Node.js for npm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm to latest version
        run: npm install -g npm@latest

      - name: Publish to NPM (Trusted Publishing)
        run: |
          cd cli
          npm publish --access public --provenance

      # -----------------------------------------------------------------
      # PR-A.3 extension: GitHub Release tarball + GitHub Packages step.
      # Same provenance/OIDC posture as the CLI publish above; deliver auth
      # through `--userconfig` per monorepo commit 7ea5351e.
      # -----------------------------------------------------------------
      - name: Pack CLI tarball (artifact)
        working-directory: cli
        run: |
          CLI_TGZ="$(npm pack 2>/dev/null | tail -n1)"
          if [[ -z "$CLI_TGZ" ]] || [[ ! -f "$CLI_TGZ" ]]; then
            echo "::error::npm pack produced no tarball"
            exit 1
          fi
          echo "CLI_TGZ=$CLI_TGZ" >> "$GITHUB_ENV"
          echo "CLI_TGZ_SHA=${CLI_TGZ}.sha256" >> "$GITHUB_ENV"
          (cd "$(dirname "$CLI_TGZ")" && shasum -a 256 "$(basename "$CLI_TGZ")" > "$(basename "$CLI_TGZ").sha256")
          echo "packed: $CLI_TGZ + sha256"

      - name: Upload CLI tarball as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanonasis-cli-tarball
          path: cli/${{ env.CLI_TGZ }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish CLI to GitHub Packages
        working-directory: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TMP_NPMRC="$(mktemp)"
          cat > "$TMP_NPMRC" <<NPMRC
          //npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}
          @lanonasis:registry=https://npm.pkg.github.com
          NPMRC
          npm publish --registry=https://npm.pkg.github.com --userconfig "$TMP_NPMRC" \
            || echo "::warning::GitHub Packages publish failed (often requires repo linkage; owner action)"
          rm -f "$TMP_NPMRC"

      - name: Create GitHub Release with CLI tarball + sha256 (push trigger only)
        if: github.event_name == 'push' && success()
        working-directory: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")"
          TAG="cli-v${VERSION}"
          if gh release view "$TAG" --repo lanonasis/lanonasis-maas >/dev/null 2>&1; then
            echo "::notice::release $TAG already exists; skipping gh release create"
            exit 0
          fi
          NOTES=$(cat <<NOTES
          # @lanonasis/cli v${VERSION}

          ## Install
          \`\`\`sh
          npm i https://github.com/lanonasis/lanonasis-maas/releases/download/${TAG}/${CLI_TGZ}
          \`\`\`

          Or via the npm registry: \`npm i -g @lanonasis/cli\`
          NOTES
          )
          gh release create "$TAG" "$CLI_TGZ" "$CLI_TGZ_SHA" \
            --repo lanonasis/lanonasis-maas \
            --title "@lanonasis/cli v${VERSION}" \
            --notes "$NOTES"

      - name: Create Release Tag (if manual trigger)
        if: github.event_name == 'workflow_dispatch' && success()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add cli/package.json
          git commit -m "chore: bump CLI version to ${{ github.event.inputs.version }}" || echo "No changes to commit"
          git tag -a "cli-v${{ github.event.inputs.version }}" -m "CLI Release v${{ github.event.inputs.version }}"
          git push origin "cli-v${{ github.event.inputs.version }}"

      - name: Create GitHub Release (if manual trigger)
        if: github.event_name == 'workflow_dispatch' && success()
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: cli-v${{ github.event.inputs.version }}
          release_name: CLI Release v${{ github.event.inputs.version }}
          body: |
            ## @lanonasis/cli v${{ github.event.inputs.version }}
            
            ### Installation
            ```bash
            npm install -g @lanonasis/cli@${{ github.event.inputs.version }}
            ```
            
            ### What's New
            - Automated release via trusted publishing
            - Enhanced security with OIDC authentication
            - Improved build and deployment pipeline
            
            ### Verification
            This package was published using npm's trusted publishing feature with provenance attestations for enhanced security.
          draft: false
          prerelease: false

      - name: Auto-publish notification (if push trigger)
        if: github.event_name == 'push' && success()
        run: |
          echo "🚀 CLI automatically published from main branch push"
          echo "📦 Package: @lanonasis/cli"
          echo "🔗 NPM: https://www.npmjs.com/package/@lanonasis/cli"
