name: CI

# Plain PR CI for the public packages in .github/release-packages.json.
# Replaces the deleted `.disabled` workflow files; intentionally thin so it
# stays compatible with both `bun install --frozen-lockfile` and `npm ci`.
#
# Matrix comes from the manifest, filtered by `"private": true` on the
# package.json — internal packages (ide-extension-core, memory-engine) do
# NOT run here.

'on':
  pull_request:
  push:
    branches: [ main ]
    paths:
      - 'packages/**'
      - 'cli/**'
      - '.github/release-packages.json'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: '@lanonasis/cli'
            dir: cli
          - label: '@lanonasis/repl-cli'
            dir: packages/repl-cli
          - label: '@lanonasis/memory-client'
            dir: packages/memory-client
          - label: '@lanonasis/memory-sdk-standalone'
            dir: packages/memory-sdk
          - label: '@lanonasis/recall-forge'
            dir: packages/recall-forge
          - label: '@lanonasis/sdk'
            dir: packages/lanonasis-sdk
          - label: '@lanonasis/claude-memory'
            dir: packages/claude-memory
          - label: '@lanonasis/pi-lanonasis-memory'
            dir: packages/pi-lanonasis-memory

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect scripts
        id: pkg
        working-directory: ${{ matrix.dir }}
        run: |
          node -e '
            const p = require("./package.json");
            const s = p.scripts || {};
            const out = [
              `private=${p.private ? "true" : "false"}`,
              `build=${s.build ? "true" : "false"}`,
              `test=${s.test ? "true" : "false"}`,
              `lint=${s.lint ? "true" : "false"}`,
              `typecheck=${s.typecheck ? "typecheck" : s["type-check"] ? "type-check" : ""}`,
            ];
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, out.join("\n") + "\n");
          '
          if [ "$(node -p 'require("./package.json").private === true')" = "true" ]; then
            echo "::notice::${{ matrix.label }} is private; skipping CI matrix entry"
          fi

      - name: Setup Bun
        if: steps.pkg.outputs.private != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        if: steps.pkg.outputs.private != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Some packages resolve types from the root node_modules (e.g. repl-cli's
      # typeRoots: ../../node_modules/@types), so install the root first.
      - name: Install root deps
        if: steps.pkg.outputs.private != 'true'
        run: bun install --frozen-lockfile

      - name: Install
        if: steps.pkg.outputs.private != 'true'
        working-directory: ${{ matrix.dir }}
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install --frozen-lockfile
          else
            bun install
          fi

      - name: Build
        if: steps.pkg.outputs.private != 'true' && steps.pkg.outputs.build == 'true'
        working-directory: ${{ matrix.dir }}
        run: bun run build

      - name: Type-check
        if: steps.pkg.outputs.private != 'true' && steps.pkg.outputs.typecheck != ''
        working-directory: ${{ matrix.dir }}
        run: bun run ${{ steps.pkg.outputs.typecheck }}

      - name: Lint
        if: steps.pkg.outputs.private != 'true' && steps.pkg.outputs.lint == 'true'
        working-directory: ${{ matrix.dir }}
        run: bun run lint

      - name: Test
        if: steps.pkg.outputs.private != 'true' && steps.pkg.outputs.test == 'true'
        working-directory: ${{ matrix.dir }}
        run: bun run test
