name: CI

# Plain PR CI for the public packages in .github/release-packages.json.
# Replaces the deleted `.disabled` workflow files; intentionally thin so it
# stays compatible with both `bun install --frozen-lockfile` and `npm ci`.
#
# Matrix comes from the manifest, filtered by `"private": true` on the
# package.json — internal packages (ide-extension-core, memory-engine) do
# NOT run here.

'on':
  pull_request:
  push:
    branches: [ main ]
    paths:
      - 'packages/**'
      - 'cli/**'
      - '.github/release-packages.json'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Package metadata points at lanonasis-maas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-package-metadata.mjs

  build:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: '@lanonasis/cli'
            dir: cli
          - label: '@lanonasis/repl-cli'
            dir: packages/repl-cli
          - label: '@lanonasis/memory-client'
            dir: packages/memory-client
          - label: '@lanonasis/memory-sdk-standalone'
            dir: packages/memory-sdk
          - label: '@lanonasis/recall-forge'
            dir: packages/recall-forge
          - label: '@lanonasis/sdk'
            dir: packages/lanonasis-sdk
          - label: '@lanonasis/claude-memory'
            dir: packages/claude-memory
          - label: '@lanonasis/pi-lanonasis-memory'
            dir: packages/pi-lanonasis-memory

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect scripts
        id: pkg
        working-directory: ${{ matrix.dir }}
        run: |
          node -e '
            const p = require("./package.json");
            const s = p.scripts || {};
            const out = [
              `private=${p.private ? "true" : "false"}`,
              `build=${s.build ? "true" : "false"}`,
              `test=${s.test ? "true" : "false"}`,
              `lint=${s.lint ? "true" : "false"}`,
              `typecheck=${s.typecheck ? "typecheck" : s["type-check"] ? "type-check" : ""}`,
            ];
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, out.join("\n") + "\n");
          '
          if [ "$(node -p 'require("./package.json").private === true')" = "true" ]; then
            echo "::notice::${{ matrix.label }} is private; skipping CI matrix entry"
          fi

      - name: Setup Bun
        if: steps.pkg.outputs.private != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        if: steps.pkg.outputs.private != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Some packages resolve types from the root node_modules (e.g. repl-cli's
      # typeRoots: ../../node_modules/@types), so install the root first.
      - name: Install root deps
        if: steps.pkg.outputs.private != 'true'
        run: bun install --frozen-lockfile

      - name: Install
        if: steps.pkg.outputs.private != 'true'
        working-directory: ${{ matrix.dir }}
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install --frozen-lockfile
          else
            bun install
          fi

      - name: Build
        if: steps.pkg.outputs.private != 'true' && steps.pkg.outputs.build == 'true'
        working-directory: ${{ matrix.dir }}
        run: bun run build

      - name: Type-check
        if: steps.pkg.outputs.private != 'true' && steps.pkg.outputs.typecheck != ''
        working-directory: ${{ matrix.dir }}
        run: bun run ${{ steps.pkg.outputs.typecheck }}

      - name: Lint
        if: steps.pkg.outputs.private != 'true' && steps.pkg.outputs.lint == 'true'
        working-directory: ${{ matrix.dir }}
        run: bun run lint

      - name: Test
        if: steps.pkg.outputs.private != 'true' && steps.pkg.outputs.test == 'true'
        working-directory: ${{ matrix.dir }}
        run: bun run test

  # ---------------------------------------------------------------------------
  # Hermes Python plugin packages
  #
  # The three Hermes plugins are Python (pyproject.toml), so they are not in
  # .github/release-packages.json and the JS `build` matrix never sees them.
  # This job installs each package editable with its `test` extra into a
  # clean venv and runs its pytest suite. Tests that need a Hermes runtime
  # (agent.* imports) skip cleanly here by design.
  #
  # Python 3.11 matches the Hermes runtime venv; requires-python is >=3.10.
  # ---------------------------------------------------------------------------
  hermes-python-packages:
    name: ${{ matrix.package }} (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        package:
          - hermes-lanonasis-memory
          - hermes-lanonasis-context-engine
          - hermes-lanonasis-secret-source

    defaults:
      run:
        working-directory: packages/${{ matrix.package }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package with test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Test
        run: python -m pytest -q -rs

  # ---------------------------------------------------------------------------
  # pi-lanonasis-memory min-SDK guard
  #
  # Why this is its own job:
  #   The regular `build` job type-checks against whatever devDependency
  #   bun.lock pins, which is always newer than the documented peer
  #   floor (>=0.80.1 in pi-extension.json / package.json). A misaligned
  #   floor is invisible to the matrix build and only surfaces when a
  #   real user installs on the minimum version.
  #
  # What it does:
  #   1. Provisions a fresh scratch dir and installs EXACTLY
  #      @earendil-works/pi-coding-agent@0.80.1 — the declared floor.
  #   2. Swaps node_modules/@earendil-works for the probe copy.
  #   3. Runs the package's `bun run check:min-sdk` script which
  #      invokes tsc --noEmit against src/ using the project's own
  #      tsconfig (no divergent probe config).
  #   4. Restores node_modules in a finally block.
  #
  # Scope:
  #   Only triggers when packages/pi-lanonasis-memory/** or this
  #   workflow file change, so PRs that don't touch the package (and
  #   PRs in the wider monorepo that aren't stacked on this one) do
  #   not pay the install cost. The job is intentionally narrow — its
  #   only purpose is to prove the floor is honest.
  # ---------------------------------------------------------------------------
  pi-lanonasis-memory-min-sdk:
    name: pi-lanonasis-memory min-sdk type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Filter to runs that actually touch the package (or this
      # workflow file). Skips the install/network cost for unrelated
      # PRs in the matrix. Uses the documented `dorny/paths-filter`
      # action — it inspects the PR diff on pull_request events and
      # the head commit on push events, returning a `changed` output.
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # tokens are OR-ed; a token matching any changed file wins.
          filters: |
            package:
              - 'packages/pi-lanonasis-memory/**'
            workflow:
              - '.github/workflows/ci.yml'

      - name: Skip (no relevant changes)
        if: steps.filter.outputs.package != 'true' && steps.filter.outputs.workflow != 'true'
        run: |
          echo "::notice::No changes under packages/pi-lanonasis-memory/ or .github/workflows/ci.yml — skipping min-sdk type-check."

      - name: Setup Bun
        if: steps.filter.outputs.package == 'true' || steps.filter.outputs.workflow == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        if: steps.filter.outputs.package == 'true' || steps.filter.outputs.workflow == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Cache the bun install cache so repeated runs don't redownload
      # the (small) pi-coding-agent tarball on every CI run. Keyed on
      # the exact floor version so a floor bump invalidates the cache.
      - name: Cache bun install cache
        if: steps.filter.outputs.package == 'true' || steps.filter.outputs.workflow == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-pi-coding-agent-floor-0.80.1-${{ runner.os }}-${{ hashFiles('packages/pi-lanonasis-memory/pi-extension.json') }}
          restore-keys: |
            bun-pi-coding-agent-floor-0.80.1-${{ runner.os }}-

      - name: Install package deps (no lockfile write)
        if: steps.filter.outputs.package == 'true' || steps.filter.outputs.workflow == 'true'
        working-directory: packages/pi-lanonasis-memory
        run: bun install --no-save

      # Use the project's own scripts/check-min-sdk.mjs which already
      # implements the swap + tsc + restore dance and prints a clear
      # message on success/failure. It exits 0 on network-skipped, which
      # we surface as a soft warning via the script's own logging rather
      # than a hard fail (the matrix `build` job is the strict gate).
      - name: Type-check src/ against the declared min SDK
        if: steps.filter.outputs.package == 'true' || steps.filter.outputs.workflow == 'true'
        working-directory: packages/pi-lanonasis-memory
        run: bun run check:min-sdk
