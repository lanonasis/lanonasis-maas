name: CLI Tests

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'cli/**'
      - 'package.json'
  workflow_dispatch:

jobs:
  unit-tests:
    name: CLI Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install CLI dependencies
        run: |
          cd cli
          bun install --frozen-lockfile

      - name: Build CLI
        run: |
          cd cli
          bun run build

      - name: Smoke test — prescan command resolves
        run: |
          cd cli
          node dist/index.js prescan --help 2>&1 | head -20

      - name: Run CLI unit tests
        run: |
          cd cli
          bun run test -- --testPathIgnorePatterns 'test/(integration|load)\.' --testTimeout 60000
        timeout-minutes: 5
