name: CLI Tests

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'cli/**'
      - 'package.json'
  workflow_dispatch:

jobs:
  integration:
    name: CLI Build + Offline Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # One supported workspace command: builds the CLI and its internal
      # dependencies from a clean checkout (no prebuilt cli/dist).
      - name: Smoke test — prescan command resolves
        run: |
          bun run build:cli
          node cli/dist/index.js prescan --help 2>&1 | head -20

      # Deterministic offline integration coverage is a REQUIRED check. The
      # default `onasis api-keys ...` transport path is asserted here: it must
      # not require --no-mcp and must not attempt MCP initialization.
      - name: Run CLI offline integration suite (required)
        run: bun run test:cli:integration
        timeout-minutes: 10

      # Live-service scenarios remain explicitly opt-in (they need a reachable
      # API + vendor key); they never block a PR.
      - name: Run CLI unit tests (offline only)
        run: |
          cd cli
          bun run test -- --testPathIgnorePatterns 'test/(integration|load)\.' --testTimeout 60000
        timeout-minutes: 5
