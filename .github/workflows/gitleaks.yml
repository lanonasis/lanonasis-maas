name: Secret scan

# Runs gitleaks on every commit a PR (or a push to main) adds, so a credential
# cannot land without a red check. Uses the gitleaks binary directly: the
# gitleaks-action needs a paid licence for organisation repos.
# Findings are printed redacted; secret values never reach the log.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout (full history, so the commit range can be scanned)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned version, checksum-verified)
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan the commits this change adds
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ -n "${PUSH_BEFORE:-}" ] && ! echo "$PUSH_BEFORE" | grep -qE '^0+$' \
               && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            RANGE="${PUSH_BEFORE}..${PUSH_AFTER}"
          else
            RANGE="${PUSH_AFTER}~1..${PUSH_AFTER}"
          fi
          echo "Scanning commits in ${RANGE}"
          "$RUNNER_TEMP/gitleaks" git . \
            --log-opts="${RANGE}" \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --verbose \
            --exit-code 1
