name: Release Packages (npm + GitHub Packages + GitHub Release)

# Drives scripts/release-packages.mjs. Every package in
# .github/release-packages.json gets:
#   1) npm pack + sha256 (artifact)
#   2) optional npm publish (trusted publishing, OIDC)  — gated by manifest `npm: true`
#   3) GitHub Packages publish (--userconfig + GITHUB_TOKEN) — gated by `github: true`
#   4) gh release create <tag>-v<version> with .tgz + .sha256 attached
#
# FIRST RUN MUST BE DRY-RUN. workflow_dispatch defaults dry_run to true.

'on':
  push:
    branches: [ main ]
    paths:
      - 'packages/**'
      - 'packages/*/package.json'
      - '.github/release-packages.json'
      - '.github/workflows/release-packages.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the plan only, do not publish or create releases.'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      only:
        description: 'Optional manifest tag to restrict (e.g. repl-cli).'
        required: false
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
      ONLY: ${{ github.event.inputs.only || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate manifest JSON
        run: |
          python3 -m json.tool < .github/release-packages.json > /dev/null
          echo "manifest is valid JSON"

      - name: Print dry-run plan (mandatory first step)
        run: |
          node scripts/release-packages.mjs --dry-run ${{ env.ONLY && format('--only {0}', env.ONLY) || '' }}
        env:
          ONLY: ${{ env.ONLY }}

      - name: Abort if dry-run
        if: env.DRY_RUN == 'true'
        run: |
          echo "::notice::dry-run requested — stopping after plan print."
          exit 0

      - name: Install root deps (workspace)
        run: |
          # Per package AGENTS.md, the runner is bun. Use bun for installs.
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install --frozen-lockfile
          else
            echo "no bun.lock at root; skipping workspace install"
          fi

      - name: Live plan (registry-aware)
        run: |
          node scripts/release-packages.mjs ${{ env.ONLY && format('--only {0}', env.ONLY) || '' }}
        env:
          ONLY: ${{ env.ONLY }}

      # ---- Owner pre-requisite: configure npm trusted publishers on npmjs.com ----
      # Without that, `npm publish --provenance` will return 404. The workflow
      # proceeds either way (the publish step simply fails) but the publish-cli-
      # trusted.yml pattern below uses `id-token: write` so OIDC is wired up.
      - name: Publish each npm package
        run: |
          set -e
          set -o pipefail
          python3 - <<'PY' > /tmp/plan.tsv
          import json, pathlib, re
          manifest = json.loads(pathlib.Path(".github/release-packages.json").read_text())
          for entry in manifest.get("packages", []):
              if not (entry.get("npm") or entry.get("github")):
                  continue
              pkg = json.loads(pathlib.Path(entry["dir"], "package.json").read_text())
              print(f"{entry['tag']}\t{entry['name']}\t{entry['dir']}\t{pkg['version']}\t{bool(entry.get('npm'))}\t{bool(entry.get('github'))}")
          PY
          while IFS=$'\t' read -r TAG NAME DIR VERSION NPM GH; do
            [[ -z "$TAG" ]] && continue
            FULL_TAG="${TAG}-v${VERSION}"

            # Skip if tag already exists (idempotency).
            if git ls-remote --tags --quiet origin "refs/tags/${FULL_TAG}" | grep -q .; then
              echo "::notice::${NAME}: tag ${FULL_TAG} already exists, skipping"
              continue
            fi

            echo "=== ${NAME} ${VERSION} (${FULL_TAG}) ==="
            pushd "${DIR}" >/dev/null

            # Install + build + test (skip if package has no build/test scripts).
            if [ -f package.json ] && node -e "process.exit(!(JSON.parse(require('fs').readFileSync('package.json')).scripts?.build))"; then
              if [ -f bun.lock ] || [ -f bun.lockb ]; then
                bun install --frozen-lockfile
              else
                npm ci
              fi
              bun run build 2>/dev/null || npm run build || true
            fi

            # npm pack
            TGZ="$(npm pack 2>/dev/null | tail -n1)"
            if [ -z "$TGZ" ] || [ ! -f "$TGZ" ]; then
              echo "::error::npm pack failed for ${NAME}"
              popd >/dev/null
              continue
            fi
            SHA_FILE="${TGZ}.sha256"
            (cd "$(dirname "$TGZ")" && shasum -a 256 "$(basename "$TGZ")" > "$(basename "$SHA_FILE")")
            echo "${TGZ}|${SHA_FILE}" >> /tmp/artifacts.tsv
            echo "packed: ${TGZ} (sha256 in ${SHA_FILE})"

            # Publish to npm (OIDC trusted publishing).
            if [ "${NPM}" = "True" ] || [ "${NPM}" = "true" ]; then
              if npm view "${NAME}@${VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
                echo "::notice::${NAME}@${VERSION} already on npmjs.org; skipping npm publish"
              else
                echo "publishing ${NAME}@${VERSION} to npmjs.org via OIDC"
                npm publish --provenance --access public
              fi
            else
              echo "manifest.npm=false for ${NAME}; skipping npm publish"
            fi

            # Publish to GitHub Packages via GITHUB_TOKEN.
            if [ "${GH}" = "True" ] || [ "${GH}" = "true" ]; then
              TMP_NPMRC="$(mktemp)"
              cat > "$TMP_NPMRC" <<NPMRC
                  //npm.pkg.github.com/:_authToken=\${GITHUB_TOKEN}
                  @lanonasis:registry=https://npm.pkg.github.com
              NPMRC
              echo "publishing ${NAME}@${VERSION} to npm.pkg.github.com via GITHUB_TOKEN"
              npm publish --registry=https://npm.pkg.github.com --userconfig "$TMP_NPMRC" || \
                echo "::warning::GitHub Packages publish failed for ${NAME} (often requires repo linkage; owner action)"
              rm -f "$TMP_NPMRC"
            fi

            popd >/dev/null

            # Attach tarball + sha256 to GitHub Release.
            ART_TGZ="$(grep "^${FULL_TAG}|" /tmp/artifacts.tsv | tail -n1 | cut -d'|' -f2 | sed "s|^|${DIR}/|")"
            ART_SHA="${ART_TGZ}.sha256"
            if [ -f "${DIR}/${ART_TGZ##*/}" ]; then
              TGZ="${DIR}/${ART_TGZ##*/}"
              SHA="${TGZ}.sha256"
              NOTES=$(cat <<NOTES
              # ${NAME} v${VERSION}

              ## Install
              \`\`\`sh
              npm i https://github.com/lanonasis/lanonasis-maas/releases/download/${FULL_TAG}/${TGZ##*/}
              \`\`\`

              Or via the npm registry: \`npm i ${NAME}\`
              NOTES
              )
              gh release create "${FULL_TAG}" "${TGZ}" "${SHA}" \
                --repo lanonasis/lanonasis-maas \
                --title "${NAME} v${VERSION}" \
                --notes "${NOTES}" \
                || echo "::warning::gh release create failed for ${FULL_TAG}"
            else
              echo "::error::tarball missing for ${FULL_TAG}: expected at ${DIR}/${ART_TGZ##*/}"
            fi
          done < /tmp/plan.tsv

      - name: Build Python packages and attach to releases
        run: |
          set -e
          python3 - <<'PY' > /tmp/py_plan.tsv
          import json, pathlib, re
          manifest = json.loads(pathlib.Path(".github/release-packages.json").read_text())
          for entry in manifest.get("python", []):
              text = pathlib.Path(entry["dir"], "pyproject.toml").read_text()
              m = re.search(r'version\s*=\s*"([^"]+)"', text)
              if not m:
                  continue
              print(f"{entry['tag']}\t{entry['name']}\t{entry['dir']}\t{m.group(1)}")
          PY
          while IFS=$'\t' read -r TAG NAME DIR VERSION; do
            [[ -z "$TAG" ]] && continue
            FULL_TAG="${TAG}-v${VERSION}"
            if git ls-remote --tags --quiet origin "refs/tags/${FULL_TAG}" | grep -q .; then
              echo "::notice::${NAME}: tag ${FULL_TAG} already exists, skipping"
              continue
            fi
            pushd "${DIR}" >/dev/null
            python3 -m pip install --user build 2>/dev/null || python3 -m pip install build
            python3 -m build
            SDIST="$(ls dist/*.tar.gz 2>/dev/null | head -n1)"
            WHEEL="$(ls dist/*.whl 2>/dev/null | head -n1)"
            if [ -z "$SDIST" ] || [ -z "$WHEEL" ]; then
              echo "::error::python -m build failed for ${NAME}"
              popd >/dev/null
              continue
            fi
            NOTES="# ${NAME} v${VERSION}
          sdist: ${SDIST##*/}
          wheel: ${WHEEL##*/}
          "
            gh release create "${FULL_TAG}" "${SDIST}" "${WHEEL}" \
              --repo lanonasis/lanonasis-maas \
              --title "${NAME} v${VERSION}" \
              --notes "${NOTES}" \
              || echo "::warning::gh release create failed for ${FULL_TAG}"
            popd >/dev/null
          done < /tmp/py_plan.tsv

      - name: Summary
        if: always()
        run: |
          echo "::notice::release-packages job finished. dry_run=${DRY_RUN}"